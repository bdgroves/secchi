[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Standard Python packaging metadata.
# Runtime dependencies live in [tool.pixi.dependencies] below, not here —
# pixi is the single source of truth so conda-forge handles the binary deps
# (matters once GDAL / rasterio / geopandas land).
# ---------------------------------------------------------------------------
[project]
name = "secchi"
version = "0.1.0"
description = "A modern Secchi disk for Lake Tahoe — real-time clarity, watershed, and wildfire-coupling analytics on TEON data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Brooks Groves" },
]
keywords = ["lake-tahoe", "teon", "limnology", "watershed", "wildfire", "remote-sensing", "environmental-intelligence"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]

[project.urls]
Homepage = "https://github.com/bdgroves/secchi"
Repository = "https://github.com/bdgroves/secchi"
"Data Source" = "https://tahoeenvironmentalobservatorynetwork.org/"

[project.scripts]
secchi-ingest = "secchi.ingest:main"
secchi-transform = "secchi.transform:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secchi"]

# ===========================================================================
# Pixi
# ===========================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# Editable install of this package so `import secchi` works everywhere.
[tool.pixi.pypi-dependencies]
secchi = { path = ".", editable = true }

# Runtime dependencies — resolved from conda-forge.
[tool.pixi.dependencies]
python = ">=3.11,<3.13"
httpx = ">=0.27"
pandas = ">=2.2"
pyarrow = ">=16.0"
python-dateutil = ">=2.9"
pydantic = ">=2.7"

# Everyday commands. `pixi run <name>` from anywhere in the repo.
[tool.pixi.tasks]
ingest    = "python -m secchi.ingest"
transform = "python -m secchi.transform"
pipeline  = { depends-on = ["ingest", "transform"] }
serve     = "python -m http.server 8000 --directory web"

# ---------------------------------------------------------------------------
# Features — additive dependency sets, composed into environments below.
# ---------------------------------------------------------------------------

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.5"
pytest = ">=8.0"
pytest-cov = ">=5.0"
jupyterlab = ">=4.2"
ipykernel = ">=6.29"

[tool.pixi.feature.dev.tasks]
lint   = "ruff check src"
format = "ruff format src"
test   = "pytest"
lab    = "jupyter lab"

# Geospatial layer — enable when raster/vector work lands.
# Uncomment and run `pixi install` to add.
# [tool.pixi.feature.geo.dependencies]
# gdal      = ">=3.9"
# rasterio  = ">=1.3"
# geopandas = ">=1.0"
# xarray    = ">=2024.6"
# rioxarray = ">=0.15"

[tool.pixi.environments]
default = { solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }
# geo   = { features = ["dev", "geo"], solve-group = "geo" }

# ===========================================================================
# Tooling config
# ===========================================================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
