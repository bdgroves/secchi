[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secchi"
version = "0.1.0"
description = "A modern Secchi disk for Lake Tahoe — real-time clarity, watershed, and wildfire-coupling analytics on TEON data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Brooks Groves" },
]
keywords = ["lake-tahoe", "teon", "limnology", "watershed", "wildfire", "remote-sensing", "environmental-intelligence"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-dateutil>=2.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[project.urls]
Homepage = "https://github.com/bdgroves/secchi"
Repository = "https://github.com/bdgroves/secchi"
"Data Source" = "https://tahoeenvironmentalobservatorynetwork.org/"

[project.scripts]
secchi-ingest = "secchi.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secchi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
