[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Standard Python packaging metadata.
# Runtime dependencies live in [tool.pixi.dependencies] below, not here —
# pixi is the single source of truth so conda-forge handles the binary deps
# (matters once GDAL / rasterio / geopandas land).
# ---------------------------------------------------------------------------
[project]
name = "secchi"
version = "0.1.0"
description = "A modern Secchi disk for Lake Tahoe — real-time clarity, watershed, and wildfire-coupling analytics on TEON data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Brooks Groves" },
]
keywords = ["lake-tahoe", "teon", "limnology", "watershed", "wildfire", "remote-sensing", "environmental-intelligence"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]

[project.urls]
Homepage = "https://github.com/bdgroves/secchi"
Repository = "https://github.com/bdgroves/secchi"
"Data Source" = "https://tahoeenvironmentalobservatorynetwork.org/"

[project.scripts]
secchi-ingest = "secchi.ingest:main"
secchi-transform = "secchi.transform:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secchi"]

# ===========================================================================
# Pixi
# ===========================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# Editable install of this package so `import secchi` works everywhere.
[tool.pixi.pypi-dependencies]
secchi = { path = ".", editable = true }

# Runtime dependencies — resolved from conda-forge.
[tool.pixi.dependencies]
python = ">=3.11,<3.13"
httpx = ">=0.27"
pandas = ">=2.2"
pyarrow = ">=16.0"
python-dateutil = ">=2.9"
pydantic = ">=2.7"
# TEON returns naive local timestamps; we localize them to
# America/Los_Angeles (see TEON_TIMEZONE in config.py), which needs a zone
# database present. Without it the code falls back to UTC and every
# "X ago" is off by the offset.
tzdata = "*"

# Everyday commands. `pixi run <name>` from anywhere in the repo.
[tool.pixi.tasks]
# Pull every live, visible sensor — all six confirmed TEON sensor types
# across the lake sondes, forest stations, stream gauge and cameras.
ingest-all = "python -m secchi.ingest --mode all-live"
# Lake EXO sondes only. Faster; useful when iterating on the water-quality
# side without waiting on ~90 requests.
ingest     = "python -m secchi.ingest --mode live-exo"
# Diagnostic: resolve a URL slug for every live sensor type and print a
# report, writing nothing. Re-run after TEON ships backend changes, or when
# a dormant sensor type comes back online.
# Resolve slugs for EVERY sensor type, dormant included, with a coverage
# report. The live-only variant is kept because it's faster when you only
# care about what's currently streaming.
probe      = "python -m secchi.ingest --mode probe"
probe-live = "python -m secchi.ingest --mode probe-live"
# Every sensor in the inventory regardless of freshness. Dormant
# instruments still hold their history — see docs/dormant-data.md.
ingest-history = "python -m secchi.ingest --mode all-sensors"
# USGS stream gauges, via the modernized Water Data OGC APIs. Reads
# USGS_API_KEY from the environment; without it USGS caps you at 50
# requests/hour per IP instead of 1000.
usgs       = "python -m secchi.ingest --mode usgs"
# Ask each configured gauge what it actually measures, and over what period
# of record. Writes nothing. Run this before trusting the parameter lists in
# config.py — they're what we want, not what's confirmed.
usgs-probe = "python -m secchi.ingest --mode usgs-probe"
# Query every USGS station inside the Tahoe basin bounding box and report
# which are active but not yet configured. Beats hand-listing site numbers.
usgs-discover = "python -m secchi.ingest --mode usgs-discover"
# Look up the official definition of a USGS parameter code instead of
# guessing: `pixi run usgs-params -- --codes 70369`
usgs-params = "python -m secchi.ingest --mode usgs-params"
# Test whether the field-camera s3:// references resolve over public HTTPS.
camera-probe = "python -m secchi.ingest --mode camera-probe"
# ---- Reference data and ground truth --------------------------------------
# Cache the watershed catchment polygons, their ~168 attributes, and the
# variable dictionary. Static datasets: fetched once, never on the cron.
# Add --force to refetch.
reference = "python -m secchi.ingest --mode reference"
# Report what the cached polygon file actually contains: detected CRS,
# coordinate extent, geometry types, property keys, and whether polygon
# names line up with the attribute records. Written after the first
# catchment-join matched 0 of 28 stations.
reference-inspect = "python -m secchi.ingest --mode reference-inspect"
# Compare the upstream inventory against a stored baseline and report what
# changed: new sensors or sensor types, dormant instruments resuming, live
# ones going quiet, TEON visibility flags lifting. Run hourly by
# .github/workflows/watch.yml, which opens an issue on notable changes so
# you don't have to keep checking.
watch = "python -m secchi.ingest --mode watch"
# Decide from the stored record whether TEON's dissolved-oxygen saturation
# percentage accounts for Tahoe's altitude. At 1,898 m the barometric
# pressure is 79.5% of sea level, which is enough to invert the ecological
# reading — see docs/dissolved-oxygen.md.
oxygen-check = "python -m secchi.ingest --mode oxygen-check"
# Assign every station and gauge to its containing catchment and report the
# attributes that would attach. The join that turns an outlier into an
# explanation. Requires `reference` and `transform` to have run.
catchment-join = "python -m secchi.ingest --mode catchment-join"
# Report what UC Davis TERC's Secchi data package (edi.1340) contains —
# revisions, entities, real column headers. This is the ground truth for
# any clarity model, and this command is how we replace guessed column
# names with actual ones.
terc-discover = "python -m secchi.ingest --mode terc-discover"
transform  = "python -m secchi.transform"
# Delete raw snapshots past RAW_RETENTION_DAYS. Safe only because
# transform accumulates into data/processed/*.parquet, which is the
# durable record — run transform BEFORE prune, never after.
prune      = "python -m secchi.ingest --mode prune"
pipeline   = { depends-on = ["ingest-all", "usgs", "transform", "prune"] }
serve      = "python -m http.server 8000 --directory web"

# ---------------------------------------------------------------------------
# Features — additive dependency sets, composed into environments below.
# ---------------------------------------------------------------------------

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.5"
pytest = ">=8.0"
pytest-cov = ">=5.0"
jupyterlab = ">=4.2"
ipykernel = ">=6.29"

[tool.pixi.feature.dev.tasks]
lint   = "ruff check src"
format = "ruff format src"
test   = "pytest"
lab    = "jupyter lab"

# Geospatial layer — enable when raster/vector work lands.
# Uncomment and run `pixi install` to add.
# [tool.pixi.feature.geo.dependencies]
# gdal      = ">=3.9"
# rasterio  = ">=1.3"
# geopandas = ">=1.0"
# xarray    = ">=2024.6"
# rioxarray = ">=0.15"

[tool.pixi.environments]
default = { solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }
# geo   = { features = ["dev", "geo"], solve-group = "geo" }

# ===========================================================================
# Tooling config
# ===========================================================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
