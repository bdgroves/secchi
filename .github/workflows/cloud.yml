name: cloud

# The store, copied into SQL Server 2022 and checked (docs/cloud.md).
#
# Starts a throwaway SQL Server 2022 container, runs the same four commands
# you'd run against Azure SQL Database (inventory, export, load, reconcile),
# and fails if any table-month, or any site's catchment, comes out different.
# Commits nothing: the reconcile report is the job summary and an artifact.
#
# Runs when the cloud code changes, weekly on Mondays as a standing check
# that the store still moves cleanly, and by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "src/secchi/cloud/**"
      - "cloud/sql/**"
      - "cloud/dotnet/**"
      - ".github/workflows/cloud.yml"
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloud
  cancel-in-progress: true

jobs:
  sqlserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: pyproject.toml
          cache: true

      - name: Start SQL Server 2022
        run: |
          PW="Sx-$(openssl rand -hex 12)-9a"
          echo "::add-mask::$PW"
          echo "SECCHI_SQL_PASSWORD=$PW" >> "$GITHUB_ENV"
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=$PW" mcr.microsoft.com/mssql/server:2022-latest > /dev/null

      - name: Install sqlcmd and bcp (mssql-tools18)
        run: |
          if ! command -v bcp > /dev/null; then
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
            curl -sSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 unixodbc > /dev/null
            echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          fi

      - name: Create the database
        env:
          SQLCMDPASSWORD: ${{ env.SECCHI_SQL_PASSWORD }}
        run: |
          export PATH="/opt/mssql-tools18/bin:$PATH"
          for i in $(seq 1 60); do
            sqlcmd -C -S localhost -U sa -Q "SELECT 1" > /dev/null 2>&1 && break
            sleep 2
          done
          sqlcmd -C -S localhost -U sa -b -Q "CREATE DATABASE secchi"

      - name: Inventory and export
        run: |
          pixi run cloud-inventory
          pixi run cloud-export

      - name: Load and reconcile
        env:
          SECCHI_SQL_SERVER: localhost
          SECCHI_SQL_DATABASE: secchi
          SECCHI_SQL_USER: sa
          SECCHI_SQL_TRUST_CERT: "1"
        run: |
          set -o pipefail
          pixi run cloud-load 2>&1 | tee cloud/out/load.log
          pixi run cloud-reconcile 2>&1 | tee cloud/out/reconcile.log

      # The nightly sync, tested the way the Handoff tested its port: break
      # the copy on purpose and check the sync finds and repairs exactly
      # that. First run: nothing to do. Then delete a month of TEON
      # readings and change one USGS value; the sync must reload those two
      # table-months and nothing else, and everything must match again.
      - name: Sync, sabotage, sync
        env:
          SECCHI_SQL_SERVER: localhost
          SECCHI_SQL_DATABASE: secchi
          SECCHI_SQL_USER: sa
          SECCHI_SQL_TRUST_CERT: "1"
          SQLCMDPASSWORD: ${{ env.SECCHI_SQL_PASSWORD }}
        run: |
          set -o pipefail
          q() { sqlcmd -C -S localhost -U sa -d secchi -b -I "$@"; }
          pixi run cloud-sync 2>&1 | tee cloud/out/sync1.log
          grep -q "^sync: none" cloud/out/sync1.log
          q -Q "DELETE FROM secchi.obs WHERE ts >= '2025-08-01' AND ts < '2025-09-01';
                UPDATE TOP (1) secchi.usgs SET value = value + 1
                WHERE ts >= '2026-09-01 00:00:00 +00:00' AND ts < '2026-10-01 00:00:00 +00:00'
                  AND value IS NOT NULL;"
          pixi run cloud-sync 2>&1 | tee cloud/out/sync2.log
          grep -q "^sync: months, 2 table-months differ" cloud/out/sync2.log
          grep -q "reloaded obs 2025-08" cloud/out/sync2.log
          grep -q "reloaded usgs 2026-09" cloud/out/sync2.log
          grep -q "^sync: MATCH" cloud/out/sync2.log
          q -Q "SET NOCOUNT ON; SELECT run_id, kind, rows_loaded, months_matched, months_checked, flags_matched, result, seconds FROM secchi.run_log ORDER BY run_id" -W -s " | " | tee cloud/out/run_log.txt

      # The C# half (cloud/dotnet). A third, independent fingerprint: C#
      # reads the rows and does the arithmetic itself, so DuckDB, SQL Server
      # and .NET must all agree. Then a race: reload everything with
      # SqlBulkCopy instead of bcp, and prove the result is identical.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the C# tool
        run: dotnet build -c Release cloud/dotnet/Secchi.Cloud.Cli -nologo

      - name: "C#: fingerprint the files, then SQL Server"
        env:
          SECCHI_SQL_SERVER: localhost
          SECCHI_SQL_DATABASE: secchi
          SECCHI_SQL_USER: sa
          SECCHI_SQL_TRUST_CERT: "1"
        run: |
          set -o pipefail
          CLI=cloud/dotnet/Secchi.Cloud.Cli/bin/Release/net8.0/secchi-cloud.dll
          dotnet $CLI files 2>&1 | tee cloud/out/dotnet-files.log
          dotnet $CLI check 2>&1 | tee cloud/out/dotnet-check.log

      - name: "C#: load with SqlBulkCopy, reconcile, check"
        env:
          SECCHI_SQL_SERVER: localhost
          SECCHI_SQL_DATABASE: secchi
          SECCHI_SQL_USER: sa
          SECCHI_SQL_TRUST_CERT: "1"
        run: |
          set -o pipefail
          pixi run cloud-load --loader dotnet 2>&1 | tee cloud/out/load-dotnet.log
          pixi run cloud-reconcile 2>&1 | tee cloud/out/reconcile-dotnet.log
          dotnet cloud/dotnet/Secchi.Cloud.Cli/bin/Release/net8.0/secchi-cloud.dll check 2>&1 | tee cloud/out/dotnet-check2.log

      # Annotations are readable from the API and the run page without
      # opening the log: the last lines of whatever stopped the job.
      - name: Say why
        if: failure()
        run: |
          for f in cloud/out/dotnet-check2.log cloud/out/reconcile-dotnet.log cloud/out/load-dotnet.log cloud/out/dotnet-check.log cloud/out/dotnet-files.log cloud/out/sync2.log cloud/out/sync1.log cloud/out/reconcile.log cloud/out/load.log; do
            if [ -f "$f" ]; then
              msg=$(tail -n 25 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$(basename $f)::$msg"
            fi
          done

      - name: Headline
        if: success()
        run: |
          msg=$(tail -n 3 cloud/out/load.log; grep -A2 "^reconcile:" cloud/out/reconcile.log; grep -E "^sync:|reloaded|flags:" cloud/out/sync2.log; cat cloud/out/run_log.txt)
          echo "::notice title=matched::$(echo "$msg" | awk '{printf "%s%%0A", $0}')"
          race=$(echo "bcp:"; grep -E "^  [a-z_]+ +[0-9,]+ rows|rows copied" cloud/out/load.log;
                 echo "SqlBulkCopy:"; grep -E "^  [a-z_]+ +[0-9,]+ rows|rows copied|SqlBulkCopy" cloud/out/load-dotnet.log;
                 grep -hE "^(files|check|reconcile)" cloud/out/dotnet-files.log cloud/out/dotnet-check.log cloud/out/reconcile-dotnet.log cloud/out/dotnet-check2.log)
          echo "::notice title=csharp::$(echo "$race" | awk '{printf "%s%%0A", $0}')"

      - name: Report
        if: always()
        run: |
          if [ -f cloud/out/reconcile.md ]; then cat cloud/out/reconcile.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-reports
          path: |
            docs/cloud/inventory.md
            cloud/out/reconcile.md
            cloud/out/reconcile.json
            cloud/out/fingerprints.json
            cloud/out/bcp/manifest.json
            cloud/out/*.err
          if-no-files-found: ignore
