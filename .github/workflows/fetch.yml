name: fetch

# Pulls raw snapshots, folds them into the accumulating parquet record,
# prunes the raw buffer, and commits.
#
# Data model:
#   data/raw/               working buffer of fetch artifacts, pruned to
#                           RAW_RETENTION_DAYS.
#   data/processed/*.parquet  the DURABLE RECORD. Accumulates across runs,
#                           deduplicated on the source's own record ids.
#
# Why this workflow rebases before committing: the parquet files are
# binary, so git cannot merge them. If the cron commits while a local
# `pixi run transform` has also written them, the divergent history
# produces an unresolvable conflict — which is exactly what happened on
# 2026-09-18 and cost a rebase to untangle. Pulling first, then
# regenerating, then committing means the cron never pushes a parquet that
# diverged from the remote.

on:
  schedule:
    # Not minute 0. GitHub delays scheduled runs at busy times and drops
    # some queued jobs outright, and the start of every hour is the busiest.
    # At "0 * * * *" snapshots landed every 3-8 hours, at odd minutes, in
    # late September 2026. GitHub's advice is a different minute.
    - cron: "41 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: pyproject.toml
          environments: default
          cache: true

      - name: Register the parquet merge driver
        # So the push-retry rebase in the Commit step merges partitions as
        # sets of readings instead of failing on a binary conflict. Same
        # command a local clone runs once.
        run: pixi run setup-git

      - name: Ingest TEON
        run: pixi run ingest-all

      - name: Ingest USGS
        id: usgs
        # Still non-fatal: a USGS outage shouldn't cost us the TEON
        # snapshot, which is the time-sensitive half. But see the step
        # below — on 2026-09-18 a code change made every gauge return zero
        # features, the step exited 1 every run, and continue-on-error
        # swallowed it silently for hours. Failing softly is right;
        # failing *invisibly* is not.
        continue-on-error: true
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: pixi run usgs

      - name: Surface a USGS failure
        if: always()
        # Writes to the run summary so a failure is visible on the Actions
        # page without opening the log, and annotates the run so it shows
        # in the list. The job still succeeds — this is a notice, not a
        # gate.
        run: |
          if [ "${{ steps.usgs.outcome }}" = "failure" ]; then
            echo "::warning title=USGS ingest failed::pixi run usgs exited non-zero. TEON data still collected. Check whether gauges are returning zero features."
            {
              echo "### USGS ingest failed"
              echo ""
              echo "\`pixi run usgs\` exited non-zero. TEON ingest was unaffected."
              echo ""
              echo "Most likely causes:"
              echo "- Every gauge returning **0 features** with HTTP 200 —"
              echo "  a query-parameter problem rather than an outage."
              echo "  \`statistic_id\` does not accept a comma-separated list."
              echo "- Rate limit exhausted (check \`USGS_API_KEY\` is set)."
              echo "- USGS API outage."
              echo ""
              echo "Run \`pixi run usgs-probe\` locally to see what the gauges"
              echo "actually serve."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "USGS ingest ok"
          fi

      - name: Take the remote's parquet before regenerating
        # Belt and braces alongside the merge driver. Instead of merging:
        # reset those paths to whatever is on the remote, then let
        # transform rebuild from data/raw/ — which accumulates and dedupes,
        # so the result contains both sides' rows regardless of which copy
        # we started from.
        run: |
          git fetch origin main
          git checkout origin/main -- data/processed/ 2>/dev/null || true

      - name: Fold into the parquet record
        # Must run before prune: raw is about to be deleted, so anything
        # not accumulated now is lost.
        run: pixi run transform

      - name: Ingest SNOTEL
        id: snotel
        # AFTER the reset to the remote's parquet above, not with the other
        # ingests. SNOTEL writes straight into data/processed/ — it has no
        # raw buffer — so the reset would wipe its rows every run and the
        # job would quietly commit nothing. Fetches the last 30 days; the
        # store rewrites only days that changed. Non-fatal, and visible
        # below, like USGS.
        continue-on-error: true
        run: pixi run snotel

      - name: Surface a SNOTEL failure
        if: always()
        run: |
          if [ "${{ steps.snotel.outcome }}" = "failure" ]; then
            echo "::warning title=SNOTEL ingest failed::pixi run snotel exited non-zero. TEON and USGS data still collected."
            {
              echo "### SNOTEL ingest failed"
              echo ""
              echo "\`pixi run snotel\` exited non-zero. TEON and USGS were unaffected."
              echo "Run it locally: a changed response layout stops with a sample of what arrived."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SNOTEL ingest ok"
          fi

      - name: Ingest HMS smoke
        id: smoke
        # After the parquet reset, like SNOTEL: it writes straight into
        # data/processed/. Fetches from two days before the newest stored
        # day, so a few requests a run.
        continue-on-error: true
        run: pixi run smoke

      - name: Surface an HMS smoke failure
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" = "failure" ]; then
            echo "::warning title=HMS smoke ingest failed::pixi run smoke exited non-zero. Other data still collected."
            echo "### HMS smoke ingest failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "HMS smoke ingest ok"
          fi

      # ---- Beyond TEON, added 2026-10-02 -----------------------------------
      # All after the reset, all non-fatal, all surfaced. TERC and the Snow
      # Lab write to data/reference/ (small CSVs, rewritten only when their
      # content changes); airports write to data/processed/asos_observations.
      # The Snow Lab's daily SNOTEL data comes with the SNOTEL step above.

      - name: Refresh TERC Secchi record
        id: terc
        # Two small index queries a run; downloads only when TERC publishes
        # a new revision of edi.1340 (a few times a year).
        continue-on-error: true
        run: pixi run terc

      - name: Refresh Snow Lab climatology
        id: cssl
        # 147 rows that change once a year: once a day is plenty, at 13 UTC,
        # or whenever the file is missing.
        continue-on-error: true
        run: |
          if [ -f data/reference/cssl_snow_climatology.csv ] && [ "$(date -u +%H)" != "13" ]; then
            echo "Snow Lab climatology: not the daily hour, skipped"
          else
            pixi run cssl
          fi

      - name: Ingest airport weather
        id: asos
        # Self-limiting: does nothing once yesterday is held, and ACIS being
        # over capacity is a warning (exit 0), retried next run.
        continue-on-error: true
        run: pixi run asos

      - name: Surface a Beyond-TEON failure
        if: always()
        run: |
          for s in "terc:TERC Secchi" "cssl:Snow Lab climatology" "asos:airport weather"; do
            id="${s%%:*}"; name="${s#*:}"
            case "$id" in
              terc) outcome="${{ steps.terc.outcome }}" ;;
              cssl) outcome="${{ steps.cssl.outcome }}" ;;
              asos) outcome="${{ steps.asos.outcome }}" ;;
            esac
            if [ "$outcome" = "failure" ]; then
              echo "::warning title=${name} failed::pixi run ${id} exited non-zero. TEON data still collected."
              echo "### ${name} failed (\`pixi run ${id}\`)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${name}: ${outcome}"
            fi
          done

      - name: Prune the raw buffer
        run: pixi run prune

      - name: Commit
        run: |
          git config user.name "secchi-bot"
          git config user.email "secchi-bot@users.noreply.github.com"
          git add -A data/ || true
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: hourly snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Rebase onto anything that landed while we were working, then
          # push. A parquet conflict is impossible here because we took the
          # remote's copy above and regenerated from raw.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing and retrying"
            git pull --rebase -X theirs || {
              echo "rebase failed; aborting cleanly rather than forcing"
              git rebase --abort || true
              exit 1
            }
          done
          echo "could not push after 3 attempts"
          exit 1
