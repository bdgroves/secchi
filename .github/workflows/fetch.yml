name: fetch

# Archives raw TEON snapshots into data/raw/ on a schedule. This is the
# durable record — the append-only history that the transform layer and
# future analysis build on.
#
# Pulls every live, visible sensor across all six confirmed TEON sensor
# types (lake EXO sondes, soil, air temperature, tree dendrometers, stream
# level, field cameras), skipping any site TEON flags as non-public via
# /api/site-visibility/disabled.
#
# Note: this workflow deliberately does NOT commit web/assets/latest.json.
# That file is generated at deploy time by pages.yml, which avoids merge
# conflicts between the cron and local development runs.

on:
  schedule:
    # Every hour on the hour.
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/secchi/**"
      - ".github/workflows/fetch.yml"
      - "pyproject.toml"
      - "pixi.lock"

concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: pyproject.toml
          environments: default
          cache: true

      - name: Ingest
        run: pixi run ingest-all

      - name: Commit new snapshots
        run: |
          git config user.name "secchi-bot"
          git config user.email "secchi-bot@users.noreply.github.com"
          git add data/raw/ || true
          if git diff --cached --quiet; then
            echo "no new data"
          else
            git commit -m "data: hourly snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
