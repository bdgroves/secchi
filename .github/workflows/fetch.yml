name: fetch

on:
  schedule:
    # Every hour on the hour.
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/secchi/**"
      - ".github/workflows/fetch.yml"
      - "pyproject.toml"
      - "pixi.lock"

concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: pyproject.toml
          # Only install what ingest needs — skip dev deps in CI.
          environments: default
          # Cache is keyed on pixi.lock, so re-runs are near-instant
          # until deps change.
          cache: true

      - name: Ingest
        run: pixi run ingest

      - name: Transform
        run: pixi run transform

      - name: Commit new data
        run: |
          git config user.name "secchi-bot"
          git config user.email "secchi-bot@users.noreply.github.com"
          git add data/ web/assets/latest.json || true
          if git diff --cached --quiet; then
            echo "no new data"
          else
            git commit -m "data: hourly snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
