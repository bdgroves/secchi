name: fetch

# Archives raw snapshots into data/raw/ on a schedule. This is the durable,
# append-only record the transform layer and any future analysis build on.
#
# Two sources:
#   TEON — every live, visible sensor across all six confirmed sensor types,
#          skipping sites TEON flags non-public via /site-visibility/disabled.
#   USGS — the configured stream gauges from the modernized Water Data
#          OGC APIs.
#
# This workflow deliberately does NOT commit web/assets/latest.json. That
# file is generated at deploy time by pages.yml, which avoids merge
# conflicts between the cron and local development runs.

on:
  schedule:
    # Every hour on the hour.
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/secchi/**"
      - ".github/workflows/fetch.yml"
      - "pyproject.toml"
      - "pixi.lock"

concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: pyproject.toml
          environments: default
          cache: true

      - name: Ingest TEON
        run: pixi run ingest-all

      - name: Ingest USGS
        # Non-fatal: a USGS outage or an exhausted rate limit shouldn't cost
        # us the TEON snapshot, which is the time-sensitive half. USGS has a
        # 65-year archive and will still be there next hour.
        continue-on-error: true
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: pixi run usgs

      - name: Commit new snapshots
        run: |
          git config user.name "secchi-bot"
          git config user.email "secchi-bot@users.noreply.github.com"
          git add data/raw/ || true
          if git diff --cached --quiet; then
            echo "no new data"
          else
            git commit -m "data: hourly snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
