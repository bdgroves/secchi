name: pages

# Builds and publishes the dashboard.
#
# WHY THIS HAS ITS OWN SCHEDULE
# -----------------------------
# The obvious design is for fetch.yml's hourly data commit to trigger this
# workflow. That does not work: GitHub Actions deliberately does not create
# new workflow runs from events triggered by the default GITHUB_TOKEN, to
# prevent recursive loops. So secchi-bot's commits fire nothing, and for a
# while this page only updated when a human pushed or dispatched by hand.
#
# Rather than work around it with a personal access token (which would mean
# a credential to rotate, and a bot whose pushes can trigger arbitrary
# workflows), this workflow just runs on its own schedule. It already does
# its own ingest and transform, so it needs nothing from fetch.yml — the
# two are independent by design:
#
#   fetch.yml  maintains the durable parquet record and prunes raw.
#   pages.yml  publishes a current view. Commits nothing.
#
# Offset 25 minutes past the hour so fetch's commit has landed first, which
# means the checkout here already carries the freshest parquet and the
# ingest below only has to top it up.

on:
  schedule:
    - cron: "25 * * * *"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/secchi/**"
      - "data/processed/**"
      - "pyproject.toml"
      - "pixi.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: pyproject.toml
          environments: default
          cache: true

      - name: Pull a fresh TEON snapshot
        # Non-fatal: falling back to the committed parquet still ships a
        # current page rather than failing the deploy.
        continue-on-error: true
        run: pixi run ingest-all

      - name: Pull a fresh USGS snapshot
        id: usgs
        continue-on-error: true
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: pixi run usgs

      - name: Note a USGS failure
        if: always()
        # Same reasoning as in fetch.yml: failing softly is right, failing
        # invisibly is not. A zero-feature response returns HTTP 200, so
        # this is the only place it would otherwise be noticed.
        run: |
          if [ "${{ steps.usgs.outcome }}" = "failure" ]; then
            echo "::warning title=USGS ingest failed during deploy::Page built from the committed parquet instead. Gauge readings may be an hour stale."
          fi

      - name: Build latest.json and the map layer
        run: pixi run transform

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
