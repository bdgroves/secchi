name: pages

# Publishes web/ to GitHub Pages, generating web/assets/latest.json fresh
# at deploy time rather than reading a committed copy.
#
# latest.json is a derived artifact. Committing it meant every local
# `pixi run transform` raced the hourly fetch cron for the same path,
# producing a merge conflict on nearly every push. Generating it here also
# guarantees the published dashboard was built by current code against
# current data, with no stale-schema window after a transform change.
#
# The raw snapshots under data/ are still committed by fetch.yml — those are
# the durable record and the input to this build.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/secchi/**"
      - "data/raw/**"
      - "pyproject.toml"
      - "pixi.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: pyproject.toml
          environments: default
          cache: true

      - name: Pull a fresh TEON snapshot
        # Non-fatal: if TEON is unreachable, fall back to the committed raw
        # snapshots so a deploy still ships something current-ish rather
        # than failing outright.
        continue-on-error: true
        run: pixi run ingest-all

      - name: Pull a fresh USGS snapshot
        continue-on-error: true
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: pixi run usgs

      - name: Build latest.json
        run: pixi run transform

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
