name: pages

# Builds and publishes the dashboard. Generates web/assets/latest.json at
# deploy time rather than reading a committed copy, so local runs never
# race the hourly cron for the same path and the published page is always
# built by current code.
#
# This workflow does not commit anything. The parquet record is maintained
# by fetch.yml; a fresh pull here only sharpens the numbers on the page.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/secchi/**"
      - "data/processed/**"
      - "pyproject.toml"
      - "pixi.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: pyproject.toml
          environments: default
          cache: true

      - name: Pull a fresh TEON snapshot
        # Non-fatal: falling back to the committed record still ships a
        # current-ish page rather than failing the deploy.
        continue-on-error: true
        run: pixi run ingest-all

      - name: Pull a fresh USGS snapshot
        continue-on-error: true
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: pixi run usgs

      - name: Build latest.json
        run: pixi run transform

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
