name: probe-extras
# Throwaway: read-only probes, output committed back to this branch.
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p probe_out && (python3 probe_extras.py > probe_out/_log.txt 2>&1 || true)
      - run: |
          git config user.name "secchi-bot"; git config user.email "secchi-bot@users.noreply.github.com"
          git add -f probe_out && git commit -m "probe: output" && git push origin HEAD:probe/extras
